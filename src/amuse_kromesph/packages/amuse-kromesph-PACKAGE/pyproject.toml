[project]
name = "amuse-kromesph-PACKAGE"
dynamic = ["version"]
requires-python = ">=3.7"
dependencies = [
    "amuse-framework==2025.9.1.dev109+gf313311c0.d20260707",
    "amuse-kromesph"
]

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"

[tool.versioningit.next-version]
method = "smallest"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}+{vcs}{rev}"
dirty = "{base_version}+d{build_date:%Y%m%d}"
distance-dirty = "{next_version}.dev{distance}+{vcs}{rev}.d{build_date:%Y%m%d}"

[tool.versioningit.vcs]
method = { module = "version_helper", value = "get_amuse_version", module-dir = "amuse_kromesph/support/shared" }

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
include = ["amuse_kromesph"]
exclude = ["amuse_kromesph/*"]
artifacts = ["amuse_kromesph/kromesph_PACKAGE_worker"]

[tool.pytest.ini_options]
pythonpath = ["amuse_kromesph/tests/", "../../../../../tests"]

testpaths = ["amuse_kromesph/tests"]

